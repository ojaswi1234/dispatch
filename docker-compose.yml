services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dispatch_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dispatch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch_user -d dispatch_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://dispatch_user:password@db:5432/dispatch_db
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=dispatch.settings.development
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate && gunicorn dispatch.wsgi:application --bind 0.0.0.0:8000 --workers 2"

  celery:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://dispatch_user:password@db:5432/dispatch_db
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=dispatch.settings.development
    command: celery -A dispatch worker --loglevel=info --concurrency=2

volumes:
  postgres_data:
